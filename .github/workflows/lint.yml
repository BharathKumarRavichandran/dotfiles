name: Lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck bin/ scripts and githooks
        run: shellcheck bin/* .githooks/pre-commit

  zsh-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Syntax-check configure.sh and setup.sh scripts
        run: |
          for f in configure.sh */setup.sh; do
            zsh -n "$f"
          done
