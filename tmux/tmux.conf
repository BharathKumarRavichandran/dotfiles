# vim: set ft=tmux:
################################################################################
#    Author: Bharath Kumar Ravichandran                                        #
#  HomePage: https://github.com/BharathKumarRavichandran                       #
################################################################################

set -g default-command "${SHELL}"

bind -r tab  select-pane -t :.+
bind -r btab select-pane -t :.-

# Select pane
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

# Split window
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Merge window into current window as a pane
bind @ command-prompt -p "join window:" "join-pane -h -s ':%%'"

set -g repeat-time 1000

# Move window
bind -r < swap-window -t -1
bind -r > swap-window -t +1

# rename session
bind . command-prompt -I "#S" "rename-session '%%'"

# Resize panes like vim
bind -r H resize-pane -L 4
bind -r L resize-pane -R 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4

bind 'C-\' popup -w 80% "$SHELL"

# TrueColor
set -g  default-terminal   "tmux-256color"
set -as terminal-features  ',xterm*:RGB'
set -as terminal-features  ',*-256color:RGB:clipboard'
set -g  allow-passthrough  on

set -g history-limit 102400 # boost history
set -g status-keys   emacs

# Copy
setw -g mode-keys vi
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi L      send -X end-of-line
bind -T copy-mode-vi H      send -X start-of-line

# Clipboard
set -s set-clipboard on

# Mouse support
set -g mouse on # Tmux 2.1 and later

# Index & Name
set  -g base-index       1
set  -g pane-base-index  1
set  -g renumber-windows on
setw -g automatic-rename on

# Goyo
bind G set status

# Change default work dir
bind m attach -c '#{pane_current_path}'

# Kill session
bind X confirm-before -p "kill session #S? (y/n)" kill-session

#  tpm {{{ #
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# macvim's binary is capital-Vim at an absolute path
set -g @resurrect-processes '"~Vim->vim *" nvim'
set -g @resurrect-capture-pane-contents 'on'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-fzf-options '-w 100% -h 50% --multi -0 --no-preview --border=sharp'
set -g @plugin 'wfxr/tmux-fzf'
TMUX_FZF_LAUNCH_KEY="C-f"
TMUX_FZF_OPTIONS="-p -w 62% -h 38% -m --border=none"
# Note: Change the plugin order carefully!
set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme 'moon'
set -g @tmux_power_date_icon ' '
set -g @tmux_power_time_icon ' '
set -g @tmux_power_user_icon ' '
set -g @tmux_power_session_icon ' '
set -g @tmux_power_right_y ' %H:%M'
set -g @tmux_power_prefix_highlight_pos 'LR'

# tmux-power rewrites status-right; continuum must hook it after
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @prefix_highlight_prefix_prompt 'Wait'
set -g @prefix_highlight_copy_prompt   'Copy'
set -g @prefix_highlight_sync_prompt   'Sync'
set -g @prefix_highlight_show_copy_mode 'on'

set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key f
set -g @thumbs-command 'tmux set-buffer -w -- "{}"'
set -g @thumbs-upcase-command 'tmux set-buffer -w -- "{}" && tmux paste-buffer'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
#  }}} tpm #

# tmux-power sets this to 1
set -g status-interval 5

# use different mapping when in docker or ssh session
if -b '[ -n "$SSH_CLIENT" ] || [ -f /.dockerenv ]' ' \
    set -g status-position top;     \
    set -g prefix C-a;              \
    bind    C-a send-prefix;        \
    bind -r C-p previous-window;    \
    bind -r C-n next-window;        \
    bind "C-w" run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh attach"; \
    ' '                             \
    set -g status-position bottom;  \
    set -g prefix C-a;              \
    bind    C-a send-prefix;        \
    bind -r C-p previous-window;    \
    bind -r C-n next-window;        \
    bind "C-w" run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh attach"; \
    '
